# Runs the three long-lived processes this application needs.
#
#   docker compose up --build
#
# All three share one SQLite file on a named volume. That is the only configuration that has
# actually been run: the tests, the demo and CI are all SQLite.
#
# A PostgreSQL service is sketched at the bottom of this file, commented out. It is a starting
# point, not a supported path -- no PostgreSQL instance was ever started during development, so
# nothing about it has been verified.

name: talabflow

x-common: &common
  build: .
  restart: unless-stopped
  env_file:
    - .env
  environment:
    TALABFLOW_DATABASE_URL: sqlite:////app/data/talabflow.sqlite3
  volumes:
    - talabflow-data:/app/data

services:
  migrate:
    <<: *common
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *common
    command: ["python", "-m", "talabflow.cli", "serve", "--host", "0.0.0.0", "--port", "8000"]
    # Published on loopback only. A staff API should not be reachable from the network until
    # someone puts a TLS-terminating reverse proxy in front of it and means to expose it.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bot:
    <<: *common
    command: ["python", "-m", "talabflow.cli", "run-bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *common
    command: ["python", "-m", "talabflow.cli", "run-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  talabflow-data:

